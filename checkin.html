
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Check-In | AD ASTRA BIT</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #080b12;
            color: #fff;
            min-height: 100vh;
        }

        header {
            padding: 22px 7%;
            border-bottom: 1px solid #ffffff15;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: #fff;
            font-size: 19px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .logo span {
            color: #8ca9ff;
        }

        header a {
            color: #aab7d4;
            text-decoration: none;
            font-size: 14px;
        }

        main {
            width: min(520px, 92%);
            margin: 75px auto;
        }

        .eyebrow {
            color: #8ca9ff;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 11px;
            margin-bottom: 14px;
        }

        h1 {
            font-size: clamp(30px, 6vw, 42px);
            margin-bottom: 12px;
        }

        .subtitle {
            color: #929bb0;
            line-height: 1.7;
            margin-bottom: 30px;
        }

        .panel {
            background: #111827;
            border: 1px solid #ffffff15;
            border-radius: 18px;
            padding: 28px;
        }

        label {
            display: block;
            color: #cbd5e1;
            font-size: 13px;
            margin-bottom: 10px;
        }

        input {
            width: 100%;
            padding: 16px;
            border-radius: 10px;
            border: 1px solid #29364e;
            background: #080d18;
            color: white;
            font-size: 18px;
            letter-spacing: 4px;
            text-align: center;
            outline: none;
            text-transform: uppercase;
        }

        input:focus {
            border-color: #8ca9ff;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 17px;
            border: none;
            border-radius: 10px;
            background: #8ca9ff;
            color: #080b12;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: .55;
            cursor: not-allowed;
        }

        #message {
            display: none;
            margin-top: 18px;
            padding: 13px;
            border-radius: 9px;
            font-size: 13px;
            line-height: 1.6;
        }

        #message.success {
            display: block;
            background: #123324;
            color: #9df0bd;
            border: 1px solid #276747;
        }

        #message.error {
            display: block;
            background: #351b23;
            color: #ffabb8;
            border: 1px solid #713342;
        }

        #message.info {
            display: block;
            background: #172943;
            color: #b9d7ff;
            border: 1px solid #2d4d78;
        }

        .event-result {
            display: none;
            margin-top: 22px;
            padding: 20px;
            background: #0b1220;
            border: 1px solid #26344c;
            border-radius: 12px;
        }

        .event-result h2 {
            font-size: 19px;
            margin-bottom: 8px;
        }

        .event-result p {
            color: #9caac1;
            font-size: 13px;
            line-height: 1.7;
        }

        .account {
            color: #77849c;
            font-size: 12px;
            margin-top: 20px;
            text-align: center;
            overflow-wrap: anywhere;
        }

        @media (max-width: 500px) {
            header {
                padding: 18px 5%;
            }

            main {
                margin: 45px auto;
            }

            .panel {
                padding: 21px;
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="logo">AD <span>ASTRA</span> BIT</div>
        <a href="index.html">Back to Home</a>
    </header>

    <main>
        <p class="eyebrow">Community Portal</p>
        <h1>Event Check-In</h1>
        <p class="subtitle">
            Enter the event check-in code provided by the event organisers
            to record your attendance.
        </p>

        <section class="panel">
            <form id="checkinForm">
                <label for="eventCode">EVENT CHECK-IN CODE</label>

                <input
                    type="text"
                    id="eventCode"
                    maxlength="7"
                    minlength="7"
                    placeholder="AB1CD2E"
                    autocomplete="off"
                    required
                >

                <button type="submit" id="checkinButton" disabled>
                    Verify & Check In
                </button>
            </form>

            <div id="message" role="status" aria-live="polite"></div>

            <div class="event-result" id="eventResult">
                <h2 id="eventTitle"></h2>
                <p id="eventDescription"></p>
            </div>

            <p class="account" id="accountInfo">
                Checking your account...
            </p>
        </section>
    </main>

    <script type="module">
        import { initializeApp } from
            "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";

        import {
            getAuth,
            onAuthStateChanged,
            setPersistence,
            browserLocalPersistence
        } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";

        import {
            getFirestore,
            doc,
            getDoc,
            runTransaction,
            serverTimestamp,
            updateDoc,
            arrayUnion
        } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB9BQOlOO-tfuFzxjK0KEA7YcV3O11_WjM",
            authDomain: "ad-astra-bit.firebaseapp.com",
            projectId: "ad-astra-bit",
            storageBucket: "ad-astra-bit.firebasestorage.app",
            messagingSenderId: "104444066688",
            appId: "1:104444066688:web:d84478465cd3084f315f65",
            measurementId: "G-JJLDJF02K0"
        };

        const ADMIN_EMAILS = [
            "rachnf99@gmail.com",
            "vedujames99@gmail.com"
        ];

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const form = document.getElementById("checkinForm");
        const codeInput = document.getElementById("eventCode");
        const button = document.getElementById("checkinButton");
        const message = document.getElementById("message");
        const accountInfo = document.getElementById("accountInfo");
        const eventResult = document.getElementById("eventResult");
        const eventTitle = document.getElementById("eventTitle");
        const eventDescription = document.getElementById("eventDescription");

        let currentUser = null;
        let currentProfile = null;
        let currentRole = null;
        let accountReady = false;
        let alreadyCheckedIn = false;

        function showMessage(text, type = "info") {
            message.textContent = text;
            message.className = type;
        }

        function showEvent(title, description) {
            eventTitle.textContent = title;
            eventDescription.textContent = description;
            eventResult.style.display = "block";
        }

        function getDisplayRole(role) {
            if (role === "admin") return "Admin";

            if (role === "clubMember" || role === "student") {
                return "Club Member";
            }

            return "Guest";
        }

        function getUserName() {
            return currentProfile?.name ||
                currentUser?.displayName ||
                currentUser?.email?.split("@")[0] ||
                "Member";
        }

        async function loadAccount(user) {
            accountReady = false;
            currentUser = null;
            currentProfile = null;
            currentRole = null;

            button.disabled = true;

            if (!user) {
                window.location.replace("index.html");
                return;
            }

            if (!user.emailVerified) {
                showMessage(
                    "Please verify your email address before checking in.",
                    "error"
                );

                accountInfo.textContent = user.email || "";
                return;
            }

            const profileRef = doc(db, "users", user.uid);
            const profileSnap = await getDoc(profileRef);

            if (!profileSnap.exists()) {
                showMessage(
                    "Your account profile could not be found.",
                    "error"
                );
                return;
            }

            const profile = profileSnap.data();
            const email = (user.email || "").toLowerCase();

            const isAllowlistedAdmin = ADMIN_EMAILS.includes(email);

            const isAdmin =
                isAllowlistedAdmin &&
                profile.role === "admin" &&
                profile.status === "approved";

            const isApprovedMember =
                ["guest", "clubMember", "student"].includes(profile.role) &&
                profile.status === "approved";

            if (!isAdmin && !isApprovedMember) {
                showMessage(
                    "Your account is not approved for event check-in.",
                    "error"
                );
                return;
            }

            currentUser = user;
            currentProfile = profile;

            currentRole = isAdmin
                ? "admin"
                : profile.role === "student"
                    ? "clubMember"
                    : profile.role;

            accountReady = true;

            accountInfo.textContent =
                `${getUserName()} · ${getDisplayRole(currentRole)} · ${user.email}`;

            showMessage(
                "Your account is verified. You can check in.",
                "success"
            );

            button.disabled = false;
        }

        // =====================================
        // UPDATE PUBLIC PROFILE PARTICIPATION
        // =====================================

        async function updateParticipatedEvents(eventData) {
            const profileRef = doc(
                db,
                "publicProfiles",
                currentUser.uid
            );

            const profileSnap = await getDoc(profileRef);

            if (!profileSnap.exists()) {
                throw new Error(
                    "Your public profile could not be found."
                );
            }

            const profileData = profileSnap.data();

            const existingEvents = Array.isArray(
                profileData.participatedEvents
            )
                ? profileData.participatedEvents
                : [];

            // Avoid adding the same event again.
            const alreadyListed = existingEvents.some(
                item =>
                    item &&
                    typeof item === "object" &&
                    item.eventId === eventData.eventId
            );

            if (alreadyListed) {
                return "already-listed";
            }

            // Firestore rules independently verify the attendee record,
            // event ID, event title and event date.
            await updateDoc(profileRef, {
                participatedEvents: arrayUnion({
                    eventId: eventData.eventId,
                    title: eventData.title,
                    date: eventData.date
                }),
                updatedAt: serverTimestamp()
            });

            return "added";
        }

        // =====================================
        // EVENT CHECK-IN
        // =====================================

        async function checkIn(code) {
            if (!accountReady || !currentUser || !currentProfile) {
                throw new Error(
                    "Your account is not ready. Please refresh the page."
                );
            }

            const codeRef = doc(db, "eventCheckinCodes", code);

            // First, record attendance transactionally.
            const eventData = await runTransaction(
                db,
                async (transaction) => {
                    const codeSnap = await transaction.get(codeRef);

                    if (!codeSnap.exists()) {
                        throw new Error("Invalid check-in code.");
                    }

                    const mapping = codeSnap.data();

                    if (mapping.active !== true || !mapping.eventId) {
                        throw new Error(
                            "This check-in code is inactive or invalid."
                        );
                    }

                    const eventRef = doc(
                        db,
                        "communityEvents",
                        mapping.eventId
                    );

                    const attendeeRef = doc(
                        db,
                        "communityEvents",
                        mapping.eventId,
                        "attendees",
                        currentUser.uid
                    );

                    const eventSnap = await transaction.get(eventRef);
                    const attendeeSnap = await transaction.get(attendeeRef);

                    if (!eventSnap.exists()) {
                        throw new Error(
                            "The event linked to this code does not exist."
                        );
                    }

                    if (attendeeSnap.exists()) {
                        alreadyCheckedIn = true;

                        throw new Error(
                            "You have already checked in for this event."
                        );
                    }

                    const event = eventSnap.data();

                    const attendeeData = {
                        uid: currentUser.uid,
                        name: getUserName(),
                        email: currentUser.email,
                        usn: currentProfile.usn || "",
                        branch: currentProfile.branch || "",
                        academicYear: currentProfile.academicYear || "",
                        checkedInAt: serverTimestamp(),
                        checkinCode: code
                    };

                    transaction.set(attendeeRef, attendeeData);

                    // Return verified event information.
                    return {
                        eventId: mapping.eventId,
                        title: event.title,
                        date: event.eventDate
                    };
                }
            );

            // Attendance has now been successfully recorded.
            alreadyCheckedIn = true;

            showEvent(
                eventData.title || "AD ASTRA BIT Event",
                "Your attendance has been successfully recorded."
            );

            // Now synchronize the public profile.
            try {
                const result = await updateParticipatedEvents(eventData);

                if (result === "added") {
                    showMessage(
                        "Check-in successful! This event has also been added to your public profile.",
                        "success"
                    );
                } else {
                    showMessage(
                        "Check-in successful! This event is already listed in your public profile.",
                        "success"
                    );
                }

            } catch (profileError) {
                console.error(
                    "Public profile update failed:",
                    profileError
                );

                showMessage(
                    "Your attendance was recorded successfully, but your public profile could not be updated. Please contact an administrator.",
                    "error"
                );
            }

            form.reset();
        }

        // =====================================
        // FORM SUBMISSION
        // =====================================

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            if (!accountReady) {
                showMessage(
                    "Your account is still loading. Please wait.",
                    "error"
                );
                return;
            }

            const code = codeInput.value.trim().toUpperCase();

            if (!/^[A-Z]{2}[0-9][A-Z]{2}[0-9][A-Z]$/.test(code)) {
                showMessage(
                    "Enter a valid 7-character event code (example: AB1CD2E).",
                    "error"
                );
                return;
            }

            button.disabled = true;

            alreadyCheckedIn = false;

            showMessage(
                "Verifying your code and recording attendance...",
                "info"
            );

            eventResult.style.display = "none";

            try {
                await checkIn(code);

            } catch (error) {
                console.error("Check-in error:", error);

                showMessage(
                    error.message ||
                    "Something went wrong while checking in.",
                    "error"
                );

            } finally {
                button.disabled = !accountReady || alreadyCheckedIn;
            }
        });

        // =====================================
        // INPUT FORMATTING
        // =====================================

        codeInput.addEventListener("input", () => {
            codeInput.value = codeInput.value
                .toUpperCase()
                .replace(/[^A-Z0-9]/g, "");
        });

        // =====================================
        // AUTHENTICATION
        // =====================================

        try {
            await setPersistence(auth, browserLocalPersistence);
        } catch (error) {
            console.error("Auth persistence error:", error);
        }

        onAuthStateChanged(auth, async (user) => {
            try {
                await loadAccount(user);

            } catch (error) {
                console.error("Account loading error:", error);

                showMessage(
                    "Unable to load your account. Please refresh and try again.",
                    "error"
                );

                accountReady = false;
                button.disabled = true;
            }
        });
    </script>
</body>
</html>

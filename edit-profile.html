
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile | AD ASTRA BIT</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #080b14;
            color: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px 15px;
        }

        .container {
            width: 100%;
            max-width: 520px;
            padding: 32px;
            background: #111827;
            border: 1px solid #263247;
            border-radius: 18px;
        }

        h1 { margin: 0 0 8px; font-size: 27px; }

        .subtitle {
            color: #9ca3af;
            margin-bottom: 28px;
            line-height: 1.5;
        }

        .photo-section {
            display: flex;
            align-items: center;
            gap: 18px;
            margin-bottom: 28px;
        }

        #photoPreview, .placeholder {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #64748b;
        }

        .placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #263247;
            font-size: 28px;
            font-weight: bold;
        }

        .photo-actions {
            display: flex;
            flex-direction: column;
            gap: 9px;
        }

        .photo-actions button,
        .photo-actions label {
            cursor: pointer;
            color: #dbeafe;
            font-size: 13px;
        }

        .photo-actions label {
            background: #263247;
            padding: 9px 12px;
            border-radius: 7px;
            width: fit-content;
        }

        #photoInput { display: none; }

        .field { margin-bottom: 18px; }

        .field-label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            color: #cbd5e1;
        }

        input, select {
            width: 100%;
            padding: 13px;
            border: 1px solid #374151;
            border-radius: 8px;
            background: #0b1220;
            color: white;
            outline: none;
            font-size: 14px;
        }

        input:focus, select:focus {
            border-color: #60a5fa;
        }

        input:disabled {
            opacity: .65;
            cursor: not-allowed;
        }

        select { cursor: pointer; }

        select option {
            background: #111827;
            color: white;
        }

        .field-note {
            display: block;
            margin-top: 7px;
            color: #94a3b8;
            font-size: 11px;
            line-height: 1.5;
        }

        .username-status {
            display: block;
            margin-top: 7px;
            font-size: 12px;
            line-height: 1.4;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 28px;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 13px 18px;
            cursor: pointer;
            font-weight: bold;
        }

        #saveBtn {
            flex: 1;
            background: #60a5fa;
            color: #07111f;
        }

        #cancelBtn {
            background: #263247;
            color: white;
        }

        button:disabled {
            opacity: .6;
            cursor: wait;
        }

        #message {
            margin-top: 18px;
            font-size: 14px;
            line-height: 1.5;
        }

        .success { color: #4ade80; }
        .error { color: #f87171; }
        .info { color: #93c5fd; }

        @media(max-width: 480px) {
            .container { padding: 23px; }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Edit Profile</h1>
    <p class="subtitle">
        Update your AD ASTRA BIT account details.
    </p>

    <div class="photo-section">

        <div id="photoPlaceholder" class="placeholder">A</div>

        <img
            id="photoPreview"
            alt="Profile picture"
            style="display:none;"
        >

        <div class="photo-actions">

            <label for="photoInput">
                Choose profile picture
            </label>

            <input
                type="file"
                id="photoInput"
                accept="image/jpeg,image/png,image/webp"
            >

            <button type="button" id="removePhotoBtn">
                Remove picture
            </button>

            <small style="color:#9ca3af;">
                JPG, PNG or WebP · Max 5 MB
            </small>

        </div>
    </div>

    <div class="field">
        <label class="field-label" for="name">Full Name</label>
        <input id="name" type="text" maxlength="100" required>
    </div>

    <div class="field">
        <label class="field-label" for="username">Username</label>
        <input
            id="username"
            type="text"
            maxlength="24"
            autocomplete="off"
            spellcheck="false"
            placeholder="e.g. vedang-jaiswal"
            disabled
        >
        <small class="field-note" id="usernameNote">
            Your username is permanent and is used in your public profile URL.
        </small>
        <small class="username-status" id="usernameStatus"></small>
    </div>

    <div class="field">
        <label class="field-label" for="email">Email Address</label>
        <input id="email" type="email" disabled>
    </div>

    <div class="field">
        <label class="field-label" for="usn">USN</label>
        <input id="usn" type="text" maxlength="30" required>
    </div>

    <div class="field">
        <label class="field-label" for="branch">Branch</label>

        <select id="branch" required>
            <option value="">Select your branch</option>
            <option value="Computer Science and Engineering">Computer Science and Engineering (CSE)</option>
            <option value="Information Science and Engineering">Information Science and Engineering (ISE)</option>
            <option value="Electronics and Communication Engineering">Electronics and Communication Engineering (ECE)</option>
            <option value="Electrical and Electronics Engineering">Electrical and Electronics Engineering (EEE)</option>
            <option value="Mechanical Engineering">Mechanical Engineering</option>
            <option value="Civil Engineering">Civil Engineering</option>
            <option value="Artificial Intelligence and Machine Learning">Artificial Intelligence and Machine Learning (AI & ML)</option>
            <option value="Artificial Intelligence and Data Science">Artificial Intelligence and Data Science (AI & DS)</option>
            <option value="Other">Other</option>
        </select>
    </div>

    <div class="field">
        <label class="field-label" for="academicYear">Academic Year</label>

        <select id="academicYear" required>
            <option value="">Select your academic year</option>
            <option value="1st Year">1st Year</option>
            <option value="2nd Year">2nd Year</option>
            <option value="3rd Year">3rd Year</option>
            <option value="4th Year">4th Year</option>
        </select>
    </div>

    <div class="buttons">
        <button id="cancelBtn" type="button">Cancel</button>
        <button id="saveBtn" type="button">Save Changes</button>
    </div>

    <div id="message"></div>

</div>

<script type="module">

    import {
        initializeApp
    } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";

    import {
        getAuth,
        onAuthStateChanged,
        signOut
    } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";

    import {
        getFirestore,
        doc,
        getDoc,
        writeBatch,
        serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";


    // =====================================
    // FIREBASE CONFIGURATION
    // =====================================

    const firebaseConfig = {
        apiKey: "AIzaSyB9BQOlOO-tfuFzxjK0KEA7YcV3O11_WjM",
        authDomain: "ad-astra-bit.firebaseapp.com",
        projectId: "ad-astra-bit",
        storageBucket: "ad-astra-bit.firebasestorage.app",
        messagingSenderId: "104444066688",
        appId: "1:104444066688:web:d84478465cd3084f315f65"
    };

    const ADMIN_EMAILS = [
        "rachnf99@gmail.com",
        "vedujames99@gmail.com","maiyamdev@gmail.com","rachnajaiswal41@gmail.com"
    ];

    const RESERVED_USERNAMES = [
        "admin",
        "administrator",
        "community",
        "signup",
        "login",
        "logout",
        "profile",
        "profiles",
        "dashboard",
        "settings",
        "events",
        "event",
        "api",
        "assets",
        "index",
        "support",
        "help",
        "about",
        "contact"
    ];

    const ALLOWED_BRANCHES = [
        "Computer Science and Engineering",
        "Information Science and Engineering",
        "Electronics and Communication Engineering",
        "Electrical and Electronics Engineering",
        "Mechanical Engineering",
        "Civil Engineering",
        "Artificial Intelligence and Machine Learning",
        "Artificial Intelligence and Data Science",
        "Other"
    ];

    const ALLOWED_YEARS = [
        "1st Year",
        "2nd Year",
        "3rd Year",
        "4th Year"
    ];


    // =====================================
    // INITIALIZATION
    // =====================================

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const $ = id => document.getElementById(id);

    let currentUser = null;
    let currentProfile = null;
    let currentPublicProfile = null;

    let selectedPhoto = null;
    let removePhoto = false;
    let profileReady = false;
    let usernameAvailable = false;
    let usernameCheckVersion = 0;


    // =====================================
    // HELPERS
    // =====================================

    function showMessage(text, type = "info") {
        $("message").textContent = text;
        $("message").className = type;
    }

    function getDashboard() {
        return currentProfile?.role === "admin"
            ? "admin-dashboard.html"
            : "student-dashboard.html";
    }

    function normalizeRole(role) {
        if (role === "student") return "clubMember";
        if (role === "admin") return "admin";
        if (role === "clubMember") return "clubMember";
        return "guest";
    }

    function getPublicBranch(branch) {
        const abbreviations = {
            CSE: "Computer Science and Engineering",
            ISE: "Information Science and Engineering",
            AIML: "Artificial Intelligence and Machine Learning",
            ECE: "Electronics and Communication Engineering",
            EEE: "Electrical and Electronics Engineering",
            ME: "Mechanical Engineering",
            Civil: "Civil Engineering"
        };

        return abbreviations[branch] || branch || "Not specified";
    }

    function getPublicYear(year) {
        const years = {
            "1": "1st Year",
            "2": "2nd Year",
            "3": "3rd Year",
            "4": "4th Year"
        };

        return years[year] || year || "Not specified";
    }

    function normalizeUsername(value) {
        return value
            .trim()
            .toLowerCase()
            .replace(/\s+/g, "-");
    }

    function validateUsername(username) {
        if (!username) {
            return "Please choose a username.";
        }

        if (username.length < 3 || username.length > 24) {
            return "Username must contain 3–24 characters.";
        }

        if (!/^[a-z0-9][a-z0-9-]{1,22}[a-z0-9]$/.test(username)) {
            return "Use lowercase letters, numbers and hyphens. Do not start or end with a hyphen.";
        }

        if (RESERVED_USERNAMES.includes(username)) {
            return "This username is reserved. Please choose another.";
        }

        return null;
    }


    // =====================================
    // PROFILE PHOTO
    // =====================================

    function setPhoto(photoURL, name = "A") {

        if (photoURL) {

            $("photoPreview").src = photoURL;
            $("photoPreview").style.display = "block";
            $("photoPlaceholder").style.display = "none";

        } else {

            $("photoPreview").removeAttribute("src");
            $("photoPreview").style.display = "none";

            $("photoPlaceholder").style.display = "flex";

            $("photoPlaceholder").textContent =
                name.trim().charAt(0).toUpperCase() || "A";
        }
    }


    async function compressImage(file) {

        if (!file.type.match(/^image\/(jpeg|png|webp)$/)) {
            throw new Error("Please choose a JPG, PNG or WebP image.");
        }

        if (file.size > 5 * 1024 * 1024) {
            throw new Error("Image must be smaller than 5 MB.");
        }

        const image = await createImageBitmap(file);

        let width = image.width;
        let height = image.height;

        const maxDimension = 256;

        if (width > maxDimension || height > maxDimension) {

            const scale = maxDimension / Math.max(width, height);

            width = Math.round(width * scale);
            height = Math.round(height * scale);
        }

        const canvas = document.createElement("canvas");
        const context = canvas.getContext("2d");

        canvas.width = width;
        canvas.height = height;

        context.drawImage(image, 0, 0, width, height);

        image.close();

        let quality = 0.82;
        let result = canvas.toDataURL("image/jpeg", quality);

        while (result.length > 120000 && quality > 0.4) {

            quality -= 0.08;
            result = canvas.toDataURL("image/jpeg", quality);
        }

        if (result.length > 140000) {
            throw new Error(
                "Image is too large after compression. Try another image."
            );
        }

        return result;
    }


    // =====================================
    // USERNAME FIELD SETUP
    // =====================================

    function configureUsernameField() {

        const hasUsername = Boolean(currentProfile?.username);

        if (hasUsername) {

            $("username").value = currentProfile.username;
            $("username").disabled = true;

            $("usernameNote").textContent =
                "Your username is permanent and is used in your public profile URL.";

            $("usernameStatus").textContent =
                "Your username is already assigned.";

            $("usernameStatus").className = "username-status success";

        } else {

            $("username").value = "";
            $("username").disabled = false;

            $("username").placeholder = "e.g. vedang-jaiswal";

            $("usernameNote").textContent =
                "Choose your username once. It will become part of your permanent public profile URL.";

            $("usernameStatus").textContent =
                "One-time username setup is required for your existing account.";

            $("usernameStatus").className = "username-status info";
        }
    }


    // =====================================
    // USERNAME AVAILABILITY
    // =====================================

    $("username").addEventListener("input", async () => {

        if (!currentProfile || currentProfile.username) {
            return;
        }

        const version = ++usernameCheckVersion;

        const username = normalizeUsername($("username").value);

        $("username").value = username;
        usernameAvailable = false;

        if (!username) {
            $("usernameStatus").textContent = "";
            return;
        }

        const validationError = validateUsername(username);

        if (validationError) {

            $("usernameStatus").textContent = validationError;
            $("usernameStatus").className = "username-status error";

            return;
        }

        $("usernameStatus").textContent = "Checking availability...";
        $("usernameStatus").className = "username-status info";

        try {

            const slugRef = doc(db, "publicProfileSlugs", username);
            const slugSnapshot = await getDoc(slugRef);

            if (version !== usernameCheckVersion) return;

            if (slugSnapshot.exists()) {

                $("usernameStatus").textContent =
                    "This username is already taken.";

                $("usernameStatus").className =
                    "username-status error";

                usernameAvailable = false;

            } else {

                $("usernameStatus").textContent =
                    "Username appears available. It will be confirmed when you save.";

                $("usernameStatus").className =
                    "username-status success";

                usernameAvailable = true;
            }

        } catch (error) {

            if (version !== usernameCheckVersion) return;

            console.error("USERNAME CHECK ERROR:", error);

            $("usernameStatus").textContent =
                "Could not check username availability. Please try again.";

            $("usernameStatus").className =
                "username-status error";

            usernameAvailable = false;
        }
    });


    // =====================================
    // LOAD PROFILE
    // =====================================

    async function loadProfile(user) {

        if (!user.emailVerified) {

            await signOut(auth);
            location.replace("index.html");

            return;
        }

        const email = (user.email || "").toLowerCase();
        const isAllowlistedAdmin = ADMIN_EMAILS.includes(email);

        const profileRef = doc(db, "users", user.uid);
        const snapshot = await getDoc(profileRef);

        if (!snapshot.exists()) {

            showMessage(
                "Your profile could not be found.",
                "error"
            );

            return;
        }

        currentProfile = snapshot.data();


        // =====================================
        // ACCESS VALIDATION
        // =====================================

        if (isAllowlistedAdmin) {

            if (
                currentProfile.role !== "admin" ||
                currentProfile.status !== "approved"
            ) {

                showMessage(
                    "Admin profile is not approved.",
                    "error"
                );

                return;
            }

        } else {

            const allowedRoles = [
                "guest",
                "clubMember",
                "student"
            ];

            if (!allowedRoles.includes(currentProfile.role)) {

                showMessage(
                    "This account does not have access to edit profiles.",
                    "error"
                );

                return;
            }

            if (
                currentProfile.role === "student" &&
                currentProfile.status === "pending"
            ) {

                location.replace("pending.html");
                return;
            }

            if (currentProfile.status !== "approved") {

                await signOut(auth);
                location.replace("index.html");

                return;
            }
        }


        // =====================================
        // LOAD EXISTING PUBLIC PROFILE
        // =====================================

        const publicRef = doc(db, "publicProfiles", user.uid);
        const publicSnapshot = await getDoc(publicRef);

        currentPublicProfile = publicSnapshot.exists()
            ? publicSnapshot.data()
            : null;


        // =====================================
        // POPULATE FORM
        // =====================================

        $("name").value = currentProfile.name || "";
        $("email").value = user.email || "";
        $("usn").value = currentProfile.usn || "";

        configureUsernameField();


        // Branch compatibility

        const savedBranch = currentProfile.branch || "";

        const branchAliases = {
            CSE: "Computer Science and Engineering",
            ISE: "Information Science and Engineering",
            AIML: "Artificial Intelligence and Machine Learning",
            ECE: "Electronics and Communication Engineering",
            EEE: "Electrical and Electronics Engineering",
            ME: "Mechanical Engineering",
            Civil: "Civil Engineering"
        };

        const normalizedBranch =
            branchAliases[savedBranch] || savedBranch;

        $("branch").value = ALLOWED_BRANCHES.includes(normalizedBranch)
            ? normalizedBranch
            : "Other";


        // Academic year compatibility

        const savedYear = currentProfile.academicYear || "";

        const yearAliases = {
            "1": "1st Year",
            "2": "2nd Year",
            "3": "3rd Year",
            "4": "4th Year"
        };

        const normalizedYear =
            yearAliases[savedYear] || savedYear;

        $("academicYear").value = ALLOWED_YEARS.includes(normalizedYear)
            ? normalizedYear
            : "";

        if (savedYear && !ALLOWED_YEARS.includes(normalizedYear)) {

            showMessage(
                "Your saved academic year is not in the current options. Please select the correct year.",
                "info"
            );
        }

        setPhoto(
            currentProfile.photoURL || "",
            currentProfile.name || "A"
        );

        profileReady = true;
    }


    // =====================================
    // AUTH STATE
    // =====================================

    onAuthStateChanged(auth, async user => {

        if (!user) {

            location.replace("index.html");
            return;
        }

        currentUser = user;

        try {

            await loadProfile(user);

        } catch (error) {

            console.error("PROFILE LOAD ERROR:", error);

            showMessage(
                "Unable to load your profile: " + error.message,
                "error"
            );
        }
    });


    // =====================================
    // PHOTO INPUT
    // =====================================

    $("photoInput").addEventListener("change", event => {

        const file = event.target.files[0];

        if (!file) return;

        selectedPhoto = file;
        removePhoto = false;

        const previewURL = URL.createObjectURL(file);

        $("photoPreview").src = previewURL;
        $("photoPreview").style.display = "block";
        $("photoPlaceholder").style.display = "none";

        showMessage(
            "Picture selected. It will be compressed when saved.",
            "info"
        );
    });


    // =====================================
    // REMOVE PHOTO
    // =====================================

    $("removePhotoBtn").addEventListener("click", () => {

        selectedPhoto = null;
        removePhoto = true;

        $("photoInput").value = "";

        setPhoto("", $("name").value || "A");

        showMessage(
            "Profile picture will be removed when you save.",
            "info"
        );
    });


    // =====================================
    // NAME PREVIEW
    // =====================================

    $("name").addEventListener("input", () => {

        if (
            !selectedPhoto &&
            !currentProfile?.photoURL &&
            !removePhoto
        ) {

            setPhoto("", $("name").value || "A");
        }
    });


    // =====================================
    // CANCEL
    // =====================================

    $("cancelBtn").addEventListener("click", () => {

        if (currentProfile) {
            location.href = getDashboard();
        }
    });


    // =====================================
    // SAVE PROFILE
    // =====================================

    $("saveBtn").addEventListener("click", async () => {

        if (!currentUser || !currentProfile || !profileReady) {
            return;
        }

        const name = $("name").value.trim();
        const usn = $("usn").value.trim().toUpperCase();
        const branch = $("branch").value;
        const academicYear = $("academicYear").value;

        const isUsernameMigration = !currentProfile.username;

        const username = isUsernameMigration
            ? normalizeUsername($("username").value)
            : currentProfile.username;


        // =====================================
        // VALIDATION
        // =====================================

        if (!name || !usn || !branch || !academicYear) {

            showMessage(
                "Please fill in all profile fields.",
                "error"
            );

            return;
        }

        if (name.length > 100 || usn.length > 30) {

            showMessage(
                "Please check the length of your details.",
                "error"
            );

            return;
        }

        if (
            !ALLOWED_BRANCHES.includes(branch) ||
            !ALLOWED_YEARS.includes(academicYear)
        ) {

            showMessage(
                "Please select valid branch and academic year values.",
                "error"
            );

            return;
        }

        if (isUsernameMigration) {

            const usernameError = validateUsername(username);

            if (usernameError) {

                showMessage(usernameError, "error");
                return;
            }

            if (!usernameAvailable || $("username").value !== username) {

                showMessage(
                    "Please wait for the username availability check to finish.",
                    "error"
                );

                return;
            }
        }


        const saveBtn = $("saveBtn");

        saveBtn.disabled = true;
        saveBtn.textContent = "Saving...";


        try {

            // =====================================
            // VERIFY USERNAME AGAIN
            // =====================================

            if (isUsernameMigration) {

                const slugRef = doc(
                    db,
                    "publicProfileSlugs",
                    username
                );

                const slugSnapshot = await getDoc(slugRef);

                if (slugSnapshot.exists()) {

                    throw new Error(
                        "This username has just been claimed. Please choose another."
                    );
                }
            }


            // =====================================
            // PROCESS PROFILE PHOTO
            // =====================================

            let photoURL = currentProfile.photoURL || "";

            if (selectedPhoto) {

                showMessage(
                    "Compressing profile picture...",
                    "info"
                );

                photoURL = await compressImage(selectedPhoto);

            } else if (removePhoto) {

                photoURL = "";
            }

            if (photoURL.length > 150000) {

                throw new Error(
                    "Compressed picture exceeds the allowed size."
                );
            }


            // =====================================
            // FIRESTORE REFERENCES
            // =====================================

            const userRef = doc(
                db,
                "users",
                currentUser.uid
            );

            const publicRef = doc(
                db,
                "publicProfiles",
                currentUser.uid
            );

            const batch = writeBatch(db);


            // =====================================
            // PRIVATE PROFILE UPDATE
            // =====================================

            const privateFields = {
                name,
                usn,
                branch,
                academicYear,
                photoURL
            };

            // Username can only be added once to a legacy account.

            if (isUsernameMigration) {
                privateFields.username = username;
            }

            batch.update(userRef, privateFields);


            // =====================================
            // PUBLIC PROFILE UPDATE
            // =====================================

            const existingBio =
                typeof currentPublicProfile?.bio === "string"
                    ? currentPublicProfile.bio
                    : "";

            const publicFields = {

                uid: currentUser.uid,

                name,

                username,

                role: normalizeRole(currentProfile.role),

                branch: getPublicBranch(branch),

                academicYear,

                photoURL,

                bio: existingBio,

                updatedAt: serverTimestamp()
            };

            // Merge preserves existing badges and participatedEvents.
            // Existing bio is explicitly preserved above.

            batch.set(publicRef, publicFields, {
                merge: true
            });


            // =====================================
            // CLAIM USERNAME FOR LEGACY ACCOUNT
            // =====================================

            if (isUsernameMigration) {

                const slugRef = doc(
                    db,
                    "publicProfileSlugs",
                    username
                );

                // The rules prevent overwriting an existing slug.
                // The user, public profile and slug are committed atomically.

                batch.set(slugRef, {
                    uid: currentUser.uid
                });
            }


            // =====================================
            // COMMIT ALL CHANGES
            // =====================================

            await batch.commit();


            // =====================================
            // UPDATE LOCAL PROFILE
            // =====================================

            currentProfile = {
                ...currentProfile,
                name,
                username,
                usn,
                branch,
                academicYear,
                photoURL
            };

            currentPublicProfile = {
                ...currentPublicProfile,
                ...publicFields
            };


            showMessage(
                isUsernameMigration
                    ? "Username created! Your profile has been migrated successfully. Redirecting..."
                    : "Profile and public profile updated successfully! Redirecting...",
                "success"
            );


            setTimeout(() => {

                location.href = getDashboard();

            }, 1500);


        } catch (error) {

            console.error("PROFILE SAVE ERROR:", error);

            let message = error.message || "Could not save your profile.";

            if (error.code === "permission-denied") {

                message =
                    "Permission denied. Your Firestore Rules must be updated to allow one-time username migration. No profile changes were saved.";
            }

            showMessage(message, "error");

        } finally {

            saveBtn.disabled = false;
            saveBtn.textContent = "Save Changes";
        }
    });

</script>

</body>
</html>
